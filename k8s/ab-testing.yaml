apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-variant-a
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aceest-ab
      variant: A
  template:
    metadata:
      labels:
        app: aceest-ab
        variant: A
    spec:
      containers:
      - name: aceest
        image: meghabarua/aceest-fitness:v1
        ports:
        - containerPort: 5000
        env:
        - name: VARIANT
          value: "A"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-variant-b
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aceest-ab
      variant: B
  template:
    metadata:
      labels:
        app: aceest-ab
        variant: B
    spec:
      containers:
      - name: aceest
        image: meghabarua/aceest-fitness:v2
        ports:
        - containerPort: 5000
        env:
        - name: VARIANT
          value: "B"
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-ab-svc
spec:
  selector:
    app: aceest-ab
  ports:
  - port: 80
    targetPort: 5000
  type: NodePort
